# zoomfb configuration
# Edit while the game runs: changes are picked up within ~2 seconds.
# Key names: A-Z, 0-9, F1-F25, SPACE, TAB, ENTER, UP, DOWN, LEFT, RIGHT,
#   LEFT_SHIFT, LEFT_CONTROL, LEFT_ALT, KP_0..KP_9, MINUS, EQUAL, LEFT_BRACKET,
#   RIGHT_BRACKET, SEMICOLON, COMMA, PERIOD, SLASH, GRAVE_ACCENT, INSERT, DELETE,
#   HOME, END, PAGE_UP, PAGE_DOWN, MOUSE_1..MOUSE_8 (MOUSE_4/MOUSE_5 = side buttons),
#   or NONE to disable a key. A raw GLFW key code number also works.

# ---- Zoom ----
# Key to hold (or press, if zoom.toggle=true) to zoom.
zoom.key=LEFT_CONTROL
# false = zoom while the key is held, true = press once to zoom, again to unzoom.
zoom.toggle=false
# Zoom strength: the field of view is divided by this (1.25 to 30).
zoom.factor=4.0
# Ease in and out instead of snapping.
zoom.smooth=true
# While zooming, press these to make the zoom stronger/weaker (saved when you stop zooming).
zoom.increaseKey=EQUAL
zoom.decreaseKey=MINUS

# ---- Fullbright ----
fullbright.key=G
# Start every game with fullbright already on?
fullbright.startOn=false
# 1.0 is the "Bright" slider maximum. Raise it (2, 4, 8) if it is not bright enough.
# Very large values can break rendering on some GPUs.
fullbright.brightness=1.0
# How much night-vision ambient light is forced on (1.0 = full night vision).
fullbright.nightVision=1.0

# ---- HUD (FPS and coordinates, top left) ----
# Key that shows/hides the HUD.
hud.key=F8
# Show the HUD when the game starts?
hud.startOn=true
hud.fps=true
hud.coords=true
# Decimal places for the coordinates (0 to 6).
hud.decimals=1
# Offset from the top left corner, in GUI pixels. Raise hud.y to sit below the F3 screen.
hud.x=4
hud.y=4

# ---- In-game rebinding ----
# Press one of these in the world, then press the new key (Esc cancels).
# The new key is saved to this file. Set to NONE to disable.
rebind.zoomKey=F6
rebind.fullbrightKey=F7

# ---- Misc ----
# Re-read this file automatically when it changes.
config.liveReload=true
